services:
  - type: web
    name: sotraco-backend
    runtime: docker
    plan: free

    dockerfilePath: ./Dockerfile

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: false

      - key: APP_KEY
        generateValue: true

      - key: APP_URL
        value: https://sotraco-backend.onrender.com

      - key: DB_CONNECTION
        value: sqlite

      - key: DB_DATABASE
        value: database/databasesotraco.sqlite

      - key: SESSION_DRIVER
        value: database

      - key: CACHE_STORE
        value: database

      - key: QUEUE_CONNECTION
        value: database

      - key: BROADCAST_CONNECTION
        value: log

      - key: FILESYSTEM_DISK
        value: local

      - key: FRONTEND_URL
        value: https://sotraco-app.onrender.com