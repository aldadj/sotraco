name: sotraco_app
description: Application de gestion et suivi en direct des bus SOTRACO (Burkina Faso)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Réseau
  http: ^1.2.1

  # Carte
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Géolocalisation (côté chauffeur)
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # Temps réel (compatible protocole Pusher, utilisé avec Laravel Reverb)
  web_socket_channel: ^3.0.1

  # Gestion d'état
  provider: ^6.1.2

  # Stockage sécurisé du token
  flutter_secure_storage: ^9.2.2

  # Utilitaires
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
